version: '3.9'
services:
  postgres:
    image: postgres
    restart: unless-stopped
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: 'metastore_db'
      POSTGRES_USER: 'hive'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5432:5432'
    volumes:
      - hive-db:/var/lib/postgresql
    networks:
      - hive

  metastore:
    image: ayushtkn/hive:4.1.0-SNAPSHOT
    depends_on:
      - postgres
    restart: unless-stopped
    container_name: metastore
    hostname: metastore
    environment:
      DB_DRIVER: postgres
      SERVICE_NAME: 'metastore'
      SERVICE_OPTS: '-Xmx1G -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                     -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
                     -Djavax.jdo.option.ConnectionUserName=hive
                     -Djavax.jdo.option.ConnectionPassword=password'
    ports:
        - '9083:9083'
    volumes:
        - warehouse:/opt/hive/data/warehouse
        - type: bind
          source: ./postgresql-42.5.1.jar
          target: /opt/hive/lib/postgres.jar
    networks:
      - hive

  hiveserver2:
    image: ayushtkn/hive:4.1.0-SNAPSHOT
    depends_on:
      - metastore
    restart: unless-stopped
    container_name: hiveserver2
    environment:
      HIVE_SERVER2_THRIFT_PORT: 10000
      SERVICE_OPTS: '-Xmx1G -Dhive.metastore.uris=thrift://metastore:9083'
      IS_RESUME: 'true'
      SERVICE_NAME: 'hiveserver2'
    ports:
      - '10000:10000'
      - '10002:10002'
    volumes:
      - warehouse:/opt/hive/data/warehouse
    networks:
      - hive

  otelcollector:
    image: otel/opentelemetry-collector:latest
    container_name: otelcollector
    ports:
      - "5650:5650"         # OpenTelemetry gRPC for receiving traces and metrics
      - "5651:5651"         # OpenTelemetry HTTP for receiving traces and metrics
      - "6798:6798"         # Prometheus scraping endpoint
    volumes:
      - ./otel-config.yml:/etc/otel-config.yml
    command: ["--config", "/etc/otel-config.yml"]
    networks:
      - hive

  # Jaeger service
  jaeger:
    image: jaegertracing/all-in-one:latest
    depends_on:
      - otelcollector
    container_name: jaeger
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    ports:
      - '16686:16686' # Jaeger UI
      - '4317:4317' # Jaeger collector
      - '4318:4318' # Jaeger gRPC
      - '9411:9411'   # Zipkin
    networks:
      - hive

  # Prometheus service
  prometheus:
    image: prom/prometheus
    depends_on:
      - otelcollector
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command: ["--config.file", "/etc/prometheus/prometheus.yml"]
    ports:
      - '9090:9090'
    networks:
      - hive

  # Grafana service
  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    container_name: grafana
    ports:
      - '3000:3000'
    networks:
      - hive

volumes:
  hive-db:
  warehouse:

networks:
  hive:
    name: hive
