receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otelcollector:5650
      http:
        endpoint: otelcollector:5651

processors:
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: otelcollector:6798
    namespace: "hive_metrics"  # Use a custom namespace for your metrics
    const_labels:
      cluster: "hive_cluster"
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: 'debug'

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]